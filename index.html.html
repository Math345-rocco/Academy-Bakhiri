<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pr. Marwan — Résumés et examens S1 · S3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#07070a;--surf:#121217;--ink:#f5f5f7;--mut:#a0a0ad;--line:#2a2a33;--red:#e11d2e;--red2:#ff4757;--glow:rgba(225,29,46,.45);color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#3a0910 0,transparent 60%),var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
.nav{padding:18px 0;display:flex;justify-content:space-between;align-items:center}
.brand{font:400 1.9rem 'Bebas Neue',Impact,sans-serif;letter-spacing:.04em;display:flex;align-items:center;gap:12px}
.logo{width:56px;height:56px;border-radius:50%;padding:3px;background:linear-gradient(145deg,var(--red2),#5a0b13);box-shadow:0 6px 0 #3a060b,0 8px 22px var(--glow);transition:transform .25s;flex:none}
.logo:hover{transform:rotateY(18deg) rotateX(-8deg) translateY(-2px)}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid #07070a}
.brand i{font-style:normal;color:var(--red)}
.nav span{color:var(--mut);font-size:.85rem}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;padding:30px 0 70px}
.hero h1{font:400 clamp(3rem,9vw,6rem)/.95 'Bebas Neue',Impact,sans-serif;margin:0 0 16px;letter-spacing:.02em;text-shadow:0 4px 0 #5a0b13,0 10px 30px var(--glow)}
.hero p{color:var(--mut);max-width:44ch;margin:0}
.stage{perspective:900px;height:300px;display:grid;place-items:center}
.cube{width:150px;height:150px;position:relative;transform-style:preserve-3d;animation:spin 16s linear infinite;transition:transform .15s}
.face{position:absolute;inset:0;display:grid;place-items:center;font:400 4.2rem 'Bebas Neue',serif;color:#fff;border:2px solid var(--red2);background:linear-gradient(145deg,rgba(225,29,46,.85),rgba(60,5,10,.9));box-shadow:inset 0 0 30px rgba(0,0,0,.5),0 0 24px var(--glow)}
.f1{transform:translateZ(75px)}.f2{transform:rotateY(90deg) translateZ(75px)}.f3{transform:rotateY(180deg) translateZ(75px)}
.f4{transform:rotateY(-90deg) translateZ(75px)}.f5{transform:rotateX(90deg) translateZ(75px)}.f6{transform:rotateX(-90deg) translateZ(75px)}
.shadow{position:absolute;bottom:6px;width:170px;height:26px;border-radius:50%;background:radial-gradient(var(--glow),transparent 70%);filter:blur(6px)}
@keyframes spin{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}
.tools{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;box-shadow:0 20px 40px -20px #000}
.seg{display:flex;background:#0b0b0f;border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--mut);font:600 .9rem Inter,sans-serif;padding:8px 16px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff;box-shadow:0 4px 14px var(--glow)}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:#0b0b0f;color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--red2);outline-offset:2px}
.sem{margin:42px 0 14px;display:flex;align-items:baseline;gap:14px}
.sem h2{font:400 3rem/1 'Bebas Neue',Impact,sans-serif;margin:0;color:var(--red2);text-shadow:0 3px 0 #4a0a10}
.sem span{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px;perspective:1100px}
.mod{background:linear-gradient(160deg,#1a1a21,#0e0e13);border:1px solid var(--line);border-radius:16px;position:relative;transform-style:preserve-3d;transition:transform .15s ease-out,box-shadow .2s;box-shadow:0 18px 30px -16px #000;overflow:hidden;--mx:50%;--my:50%}
.mod::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(225,29,46,.28),transparent 60%);opacity:0;transition:opacity .2s;pointer-events:none}
.mod::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red)}
.mod.on{box-shadow:0 30px 50px -18px #000,0 0 30px -6px var(--glow);border-color:#5a1a22}
.mod.on::before{opacity:1}
.mod h3{margin:0;padding:18px 20px 2px 24px;font:400 1.7rem 'Bebas Neue',Impact,sans-serif;letter-spacing:.03em;transform:translateZ(30px)}
.mod .d{padding:0 20px 10px 24px;color:var(--mut);font-size:.9rem;margin:0}
.grp{padding:0 20px 14px 24px;transform:translateZ(18px)}
.grp h4{margin:10px 0 6px;font-size:.9rem;color:var(--red2)}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);background:#0b0b0f;border-radius:10px;margin-bottom:6px;color:var(--ink);text-decoration:none;font-size:.92rem;transition:transform .12s,background .12s}
.it:hover{background:#1c0b0e;transform:translateX(4px)}
.it b{background:var(--red);color:#fff;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:7px;box-shadow:0 3px 0 #7a0f19;white-space:nowrap}
.it:active b{transform:translateY(3px);box-shadow:none}
.empty{display:none;text-align:center;padding:40px;color:var(--mut)}
footer{margin-top:60px;padding:26px 0;border-top:1px solid var(--line);color:var(--mut);font-size:.88rem;text-align:center}
@media (max-width:760px){.hero{grid-template-columns:1fr}.stage{height:240px}.cube{transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){.cube{animation:none;transform:rotateX(-24deg) rotateY(35deg)}.mod{transition:none}}
</style>
</head>

var out=document.getElementById("out");
out.addEventListener("mousemove",function(e){var m=e.target.closest&&e.target.closest(".mod");if(!m)return;var r=m.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
m.style.transform="rotateY("+((x-.5)*14)+"deg) rotateX("+((.5-y)*14)+"deg) translateZ(10px)";m.style.setProperty("--mx",x*100+"%");m.style.setProperty("--my",y*100+"%");m.classList.add("on")});
out.addEventListener("mouseout",function(e){var m=e.target.closest&&e.target.closest(".mod");if(m&&!m.contains(e.relatedTarget)){m.style.transform="";m.classList.remove("on")}});
}
render();
</script>
</body>
</html>
